networks:
  dataplane-net:
    name: dataplane-net
    driver: bridge

volumes:
  mongo-data:

secrets:
  private_key:
    file: ./secrets/private_key.pem
  api_key:
    file: ./secrets/api_key

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - dataplane-net

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - dataplane-net
    expose:
      - "27017"

  data-plane:
    image: ghcr.io/requestrocket/data-plane:${IMAGE_TAG:-latest}
    container_name: data-plane
    restart: unless-stopped
    depends_on:
      - mongo
      - traefik
    volumes:
      - ./config.json:/app/config.json:ro
    secrets:
      - private_key
      - api_key
    networks:
      - dataplane-net
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-plane.rule=PathPrefix(`/`)"
      - "traefik.http.routers.data-plane.entrypoints=web"
      - "traefik.http.services.data-plane.loadbalancer.server.port=3000"
      - "traefik.http.services.data-plane.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.data-plane.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.data-plane.loadbalancer.healthcheck.timeout=3s"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
